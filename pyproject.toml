[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "singing-identity"
version = "0.1.0"
description = "Singing identity and technique representation experiments."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
tables = [
    "pandas>=1.5",
    "pyarrow>=10",
]
probe = [
    "matplotlib>=3.7",
    "pytest>=7",
    "scikit-learn>=1.1",
]
hf = [
    "huggingface-hub>=0.23",
    "transformers>=4.40",
]
notebook = [
    "marimo>=0.14",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
]
